name: ARM64 APK release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arm64-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v5
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build ARM64 release only
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --release --no-pub --target-platform android-arm64 --split-per-abi --build-number "$GITHUB_RUN_NUMBER"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk baby-tracker-arm64.apk
      - name: Verify APK architecture
        run: |
          python3 - <<'PYTHON'
          import zipfile
          with zipfile.ZipFile('baby-tracker-arm64.apk') as apk:
              abis = {p.split('/')[1] for p in apk.namelist() if p.startswith('lib/') and p.endswith('.so')}
              assert abis == {'arm64-v8a'}, f'Unexpected APK ABIs: {abis}'
          PYTHON
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" baby-tracker-arm64.apk --target "$GITHUB_SHA" --title "ARM64 build ${GITHUB_RUN_NUMBER}" --notes "ARM64 release APK from commit ${GITHUB_SHA}." --latest
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
